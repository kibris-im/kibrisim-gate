name = "kibrisim-gate"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Attach these hosts as Custom Domains / Routes in the dashboard:
#   kibrisim.com.tr, kibris.im, and every defensive domain in DEFENSIVE (src/index.js)

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[vars]
TURNSTILE_SITEKEY = "0x4AAAAAADS8k3Er3h_iTM-V"        # public key from Cloudflare Turnstile
CONTROLLER_NAME = "Kıbrısım"          # who is legally responsible for the list (shown on /gizlilik)
CONTACT_EMAIL = "destek@kibrisim.com.tr"            # privacy contact (shown on /gizlilik)
GATE_ENABLED = "1"            # set "0" at launch: Worker steps aside, real site answers
PERMANENT_REDIRECTS = "0"     # set "1" once defensive domains are final (301 instead of 302)

# Secrets (never in this file):
#   wrangler secret put N8N_WEBHOOK_URL
#   wrangler secret put N8N_SECRET
#   wrangler secret put TURNSTILE_SECRET

routes = [
  { pattern = "kibrisim.com.tr", custom_domain = true },
  { pattern = "kibris.im", custom_domain = true },
  { pattern = "imkibris.com", custom_domain = true },
  { pattern = "imkibris.com.tr", custom_domain = true },
  { pattern = "imkibris.net", custom_domain = true },
  { pattern = "imkıbrıs.com.tr", custom_domain = true },
  { pattern = "imkıbrıs.com", custom_domain = true },
  { pattern = "imkıbrıs.net", custom_domain = true },
  { pattern = "kıbrısım.com", custom_domain = true },
  { pattern = "kıbrısım.com.tr", custom_domain = true },
  { pattern = "kıbrısım.net", custom_domain = true },
  { pattern = "kibrisim.tr", custom_domain = true },
]
